{% extends "base.html" %}
{% block title %}{{ name }} 미리보기 — PBR 대시보드{% endblock %}
{% block content %}

<section class="hero" style="padding-bottom:var(--sp-md)">
  <h1 style="font-size:var(--fs-h2)">{{ name }}</h1>
  <p class="lead" style="font-size:var(--fs-ui)">전체 {{ total_rows }}행 중 앞 {{ shown_rows }}행</p>
  <div class="actions" style="margin-top:var(--sp-md)">
    <a class="btn sm" href="/files/{{ relpath | urlencode }}">CSV 내려받기</a>
  </div>
</section>

<div class="card flush">
  <div class="table-wrap preview-table">{{ table_html | safe }}</div>
</div>

<a class="back" href="/data">← 데이터 목록으로</a>
{% endblock %}
