{#- ════════════════════════════════════════════════════════════════
   색·모서리·여백 토큰 — 관제 화면(base.html)과 현장 앱(m_base.html)이 함께 읽는다
   (1.26.307). 규칙이 두 벌이면 한쪽만 고친다 — 이 저장소가 여러 번 겪었다.

   ⚠️ 이 조각은 **공백까지** 계산해 두었다. 부르는 쪽이 `<style>` 안에서
   4칸 들여 include로 부르고, 이 주석을 닫는 표시에 붙은 대시(공백 제거)가
   아래 `:root`의 들여쓰기를 지우므로 렌더 결과가 떼기 전의 base.html과 한 글자도
   다르지 않다(떼면서 기존 열 개 화면을 떼기 전후로 비교했다). 주석은 Jinja
   주석이라 화면에 실리지 않는다.

   색을 바꿀 때는 docs/구현/DESIGN.md '색' 절과 명암비 테스트
   (tests/test_webapp.py — `_css()`가 이 조각을 펼쳐 읽는다)를 함께 본다.
   현장 앱만 색을 바꾸려면 여기가 아니라 m_base.html의 `--m-*` 별칭 층을 고친다.
   ════════════════════════════════════════════════════════════════ -#}
    :root {
      color-scheme: light;

      /* ── 색: 단 하나의 강조색 ── */
      --blue: #0066cc;            /* Action Blue — 모든 '누를 수 있는 것' */
      --blue-focus: #0071e3;      /* 키보드 초점 링 */
      --on-blue: #ffffff;
      --on-critical: #ffffff;   /* 위험 채움(--critical) 위의 글자 — 다크에서는 어둡게 (1.26.272) */

      /* ── 면 ── */
      --canvas: #ffffff;
      --parchment: #f5f5f7;       /* Apple 특유의 오프화이트 */
      --pearl: #fafafc;
      --page: var(--parchment);
      --surface: var(--canvas);
      --surface-2: var(--parchment);
      --tile-dark: #272729;
      --nav-black: #000000;
      --nav-flow: var(--parchment);

      /* ── 글자 ── */
      --ink: #1d1d1f;             /* 순검정이 아니다 — 인쇄물이 아니라 사진처럼 */
      --ink-2: #333333;
      --ink-3: #6e6e73;
      /* Apple의 2차 회색은 #86868b지만 **라이트 모드에서 WCAG AA에 미달한다** —
         흰 바탕 3.62:1, 오프화이트 3.33:1(본문은 4.5:1이 필요). 이 토큰이
         .hint·.sub·.empty·.step-note·눈금처럼 **뜻이 있는 글자**를 칠하므로
         '장식이라 예외'가 아니다. 두 바탕 모두 넘기는 가장 밝은 값으로 내렸다
         (4.93 / 4.53). 더 밝히면 오프화이트 위에서 먼저 깨진다.
         ⚠️ 다크 값은 그대로다 — 어두운 바탕에서는 #86868b가 이미 4.65로 통과한다. */
      --ink-4: #707074;
      --on-dark: #ffffff;
      --on-dark-2: #a1a1a6;

      /* ── 선 ── */
      --hairline: #d2d2d7;
      --divider-soft: #f0f0f0;

      /* ── 상태색: 예약됨. 절대 강조색 대용으로 쓰지 않는다.
         항상 아이콘·문구와 함께 쓴다 — 색만으로 뜻을 전하지 않는다. ── */
      --good: #0ca30c;
      --good-ink: #006300;
      --good-soft: #e9f6e9;
      --warning: #fab219;
      --warning-ink: #8a5a00;
      --warning-soft: #fdf4e0;
      --critical: #d03b3b;
      --critical-ink: #b02525;
      --critical-soft: #fbecec;

      /* ── 작업 두 종류: 수거·배송. **범주색이지 상태색이 아니다.**
         예전에는 수거를 `--good-ink`, 배송을 `--blue`로 칠했는데 둘 다
         예약된 색이었고(위 상태색 규약 · `--blue`는 상호작용 전용),
         무엇보다 **지도에서는 파랑이 수거**라 같은 파랑이 두 화면에서
         정반대를 뜻했다(1.26.107).

         색은 지도와 같은 Okabe-Ito 계열이다(mapviz.PICK_COLOR/DROP_COLOR).
         지도는 채운 원이라 순색을 쓰고 여기는 글자라 명암비를 맞춘 값을
         쓴다 — 채움과 글자는 기준이 다르다(`--on-blue`에서 겪은 것과 같다).
         실측(가장 낮은 배경 기준): 배송 4.83 · 수거 4.56, 둘 다 AA 통과.

         ⚠️ 두 색은 **명도가 아니라 색상**으로 갈린다(서로 대비 1.06).
            색만으로 두면 흑백 인쇄에서 사라진다 — 반드시 글자와 함께 쓴다. */
      --pick-ink: #0072B2;        /* 수거 — 남는 곳에서 실어 온다 */
      --drop-ink: #b34700;        /* 배송 — 모자란 곳에 내린다 */

      /* ── 모서리 ── */
      --r-sm: 8px;                /* 조밀한 유틸리티 */
      --r-md: 11px;               /* 입력칸 */
      --r-lg: 18px;               /* 카드 */
      --r-pill: 9999px;           /* 동작을 뜻하는 모든 것 */

      /* ── 그림자: 시스템 전체에 단 하나.
         Apple은 '표면 위에 놓인 제품 사진'에만 쓴다. 이 앱에서 그에 해당하는
         것은 지도(산출물 그 자체)뿐이다. 카드·버튼·글자에는 쓰지 않는다. ── */
      --shadow-product: rgba(0, 0, 0, .22) 3px 5px 30px 0;

      /* ── 글자 크기 ── */
      --fs-hero: 40px;
      --fs-lead: 21px;
      --fs-h2: 24px;
      --fs-h3: 17px;
      --fs-body: 17px;
      --fs-ui: 14px;              /* 표·폼·버튼 — 밀도 유지 구간 */
      --fs-fine: 12px;

      /* ── 여백 ── */
      --sp-xs: 8px;
      --sp-sm: 12px;
      --sp-md: 17px;
      --sp-lg: 24px;
      --sp-xl: 32px;
      --sp-2xl: 48px;
      --sp-section: 80px;

      /* ── 그래프 전용 색 (docs/구현/DESIGN.md '그래프') ──
         계열은 강조색 하나(--blue)를 그대로 쓴다. 아래는 **발산 척도**용으로만
         쓰는 단계색이다 — 순수요는 부호가 있는 값이라(빠져나감 / 쌓임) 한 색조
         농담으로는 방향을 말할 수 없다. 따뜻한 쪽(빠져나감)과 찬 쪽(쌓임),
         가운데는 무채색이다. 두 극이 서로 반대로 읽혀야 하므로 파랑↔빨강을 쓴다.
         0 근처가 면 색으로 물러나는 것은 발산·순차 척도에서 허용된 규칙이다
         (색만으로 값을 읽게 두지 않으려고 척도 범례와 표 보기를 함께 낸다). */
      --viz-zero: #f0f0f0;
      --viz-pos-1: #fbdcdc;  --viz-pos-2: #f2adad;
      --viz-pos-3: #e37373;  --viz-pos-4: #d03b3b;
      --viz-neg-1: #cde2fb;  --viz-neg-2: #9ec5f4;
      --viz-neg-3: #5598e7;  --viz-neg-4: #2a78d6;
    }

    /* 다크 모드는 Apple 문서에 없다(라이트 위주로 출시된다).
       그래서 문서가 규정한 **어두운 타일 색**(#000 / #1d1d1f / #272729)과
       어두운 면 전용 파랑(#2997ff)에서 그대로 끌어왔다 — 밝은 값을 뒤집은 게 아니다. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --blue: #2997ff;
        --blue-focus: #2997ff;
        /* ⚠️ 다크 모드에서는 **파랑 위의 글자가 흰색이 아니다.**
           #2997ff는 Apple이 '어두운 면 전용'으로 정의한 파랑인데, 그건
           **글자색**으로 쓰라는 색이다(어두운 바탕 위에서 5.58:1). 이 앱은
           같은 색을 단추·현재 위치의 **채움색**으로도 쓰므로 관계가 뒤집힌다 —
           그 위에 흰 글자를 얹으면 3.02:1로 미달이다.
           파랑을 어둡게 해서 풀 수는 없다. 흰 글자가 통과할 만큼 어둡게 하면
           (#0066cc) 이번엔 링크 글자가 어두운 바탕에서 3.02로 깨진다 — 한 색이
           두 역할을 다 못 한다. 그래서 **채움색은 두고 그 위의 글자를 어둡게**
           한다. --on-blue가 애초에 '파랑 위에 놓이는 글자' 토큰이다. */
        --on-blue: #1d1d1f; --on-critical: #1d1d1f;
        --canvas: #1d1d1f;
        --parchment: #000000;
        --pearl: #272729;
        --page: #000000;
        --surface: #1d1d1f;
        --surface-2: #272729;
        --nav-black: #000000;
        --nav-flow: #141415;
        --ink: #f5f5f7;
        --ink-2: #d2d2d7;
        --ink-3: #a1a1a6;
        --ink-4: #86868b;
        --hairline: #424245;
        --divider-soft: #2a2a2c;
        --good-ink: #41c141;
        --good-soft: #14290f;
        --warning-ink: #f5c265;
        --warning-soft: #33280f;
        --critical: #ff6961;
        --critical-ink: #ff8a82;
        --critical-soft: #3a1a1a;

        /* 어두운 면에서는 라이트 값이 배경에 잠긴다(#0072B2 = 3.28).
           같은 색상 계열을 밝힌 값. 실측 최저: 배송 6.69 · 수거 5.88. */
        --pick-ink: #56B4E9;
        --drop-ink: #ff9e6b;

        /* 그래프 발산 척도 — 어두운 면에서는 0 근처가 면 색으로 물러나야 하므로
           단계가 뒤집힌다(어두운 쪽이 0, 밝은 쪽이 큰 값). 밝은 값을 뒤집은 것이
           아니라 어두운 면 기준으로 따로 고른 값이다. */
        --viz-zero: #2a2a2c;
        --viz-pos-1: #6e1c1c;  --viz-pos-2: #a52a2a;
        --viz-pos-3: #d03b3b;  --viz-pos-4: #e37373;
        --viz-neg-1: #0d366b;  --viz-neg-2: #184f95;
        --viz-neg-3: #2a78d6;  --viz-neg-4: #5598e7;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --blue: #2997ff;
      --blue-focus: #2997ff;
      /* 위 @media 블록과 같은 이유 — 다크에서는 파랑 위 글자가 어둡다. */
      --on-blue: #1d1d1f; --on-critical: #1d1d1f;
      --canvas: #1d1d1f;
      --parchment: #000000;
      --pearl: #272729;
      --page: #000000;
      --surface: #1d1d1f;
      --surface-2: #272729;
      --nav-black: #000000;
      --nav-flow: #141415;
      --ink: #f5f5f7;
      --ink-2: #d2d2d7;
      --ink-3: #a1a1a6;
      --ink-4: #86868b;
      --hairline: #424245;
      --divider-soft: #2a2a2c;
      --good-ink: #41c141;
      --good-soft: #14290f;
      --warning-ink: #f5c265;
      --warning-soft: #33280f;
      --critical: #ff6961;
      --critical-ink: #ff8a82;
      --critical-soft: #3a1a1a;

      /* 어두운 면에서는 라이트 값이 배경에 잠긴다(#0072B2 = 3.28).
         같은 색상 계열을 밝힌 값. 실측 최저: 배송 6.69 · 수거 5.88. */
      --pick-ink: #56B4E9;
      --drop-ink: #ff9e6b;

      /* 그래프 발산 척도 — 어두운 면에서는 0 근처가 면 색으로 물러나야 하므로
         단계가 뒤집힌다(어두운 쪽이 0, 밝은 쪽이 큰 값). 밝은 값을 뒤집은 것이
         아니라 어두운 면 기준으로 따로 고른 값이다. */
      --viz-zero: #2a2a2c;
      --viz-pos-1: #6e1c1c;  --viz-pos-2: #a52a2a;
      --viz-pos-3: #d03b3b;  --viz-pos-4: #e37373;
      --viz-neg-1: #0d366b;  --viz-neg-2: #184f95;
      --viz-neg-3: #2a78d6;  --viz-neg-4: #5598e7;
    }
