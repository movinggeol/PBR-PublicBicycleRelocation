{% extends "base.html" %}
{% block title %}{{ name }} — PBR 대시보드{% endblock %}
{% block content %}
<h1 style="font-size:1.1rem">{{ name }}
  <a class="muted" style="font-weight:normal; margin-left:0.6rem"
     href="/files/{{ relpath | urlencode }}" target="_blank">새 창에서 열기 ↗</a>
</h1>
<iframe class="map-frame" src="/files/{{ relpath | urlencode }}"></iframe>
<p><a href="/maps">← 지도 목록으로</a></p>
{% endblock %}
