name: tests

# 테스트 572개는 합성 데이터로 step0~step4를 실제로 돌린다(원천 CSV·API 키 불필요).
# 그래서 CI에서 그대로 돌릴 수 있다 — docs/구현/TESTING.md 참고.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 검증 환경은 3.14.7(Windows 11)이다. requirements.txt는 하한(>=) 고정이라
          # 새 파이썬에서도 휠이 있으면 설치된다 — 상한을 걸지 마라(1.2.1에서 겪음).
          python-version: '3.14'
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 테스트
        run: python -m pytest -q

      # 문서가 코드와 다른 값을 말하면 여기서 걸린다. 세 번 되살아났던 것들
      # (테스트 개수·차량 대수·테이블 수)을 사람 대신 기계가 본다 — 1.26.91.
      #
      # `--no-commit-check`인 이유: checkout이 얕은 클론이라 이력이 한 개뿐이고,
      # 커밋 접두사 검사는 이미 push된 이력을 보는 것이라 CI에서 할 일이 아니다.
      # 그쪽은 로컬에서 `python tools/check_consistency.py`로 본다.
      - name: 문서·코드 정합성
        run: python tools/check_consistency.py --strict --no-commit-check
